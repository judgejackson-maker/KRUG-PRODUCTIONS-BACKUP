<style>
*{box-sizing:border-box}
body{margin:0;background:#070c17;color:white;font-family:Arial,sans-serif}
header{padding:17px 5%;background:#101a2d;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:23px;font-weight:900;letter-spacing:1px}
.logo span{color:#38c5ff}
header button,.bar button{background:#243b5c;color:white;border:0;padding:11px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
.hero{text-align:center;padding:48px 15px;background:radial-gradient(circle at 50% 0,#24527c,#10182c 65%)}
.hero h1{font-size:clamp(36px,7vw,68px);margin:0}
.hero h1 span{color:#39c5ff}
.hero p{color:#c3d3e8}
#search{width:min(540px,95%);padding:15px;border-radius:10px;border:1px solid #47617e;background:#091426;color:white;font-size:16px}
main{max-width:1500px;margin:auto;padding:30px 5%}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px}
.card{background:#111d30;border:1px solid #293e5c;border-radius:13px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#36bfff}
.cover{height:135px;display:grid;place-items:center;font-size:65px;background:linear-gradient(135deg,#244d73,#11182b);position:relative}
.cardbody{padding:15px}
.cardbody h3{margin:0 0 8px;font-size:16px}
.cardbody p{color:#aebfd5;font-size:13px;min-height:32px}
.tag{position:absolute;top:10px;left:10px;background:#009d75;padding:6px 8px;border-radius:6px;font-size:10px;font-weight:bold}
.play{width:100%;padding:12px;border:0;border-radius:8px;background:#168bc6;color:white;font-weight:bold;cursor:pointer}
.play:hover{background:#32b8f3}
#player{display:none;position:fixed;inset:0;background:#050912;z-index:10;flex-direction:column}
.bar{height:55px;flex-shrink:0;background:#101c30;display:flex;justify-content:space-between;align-items:center;padding:7px 12px;gap:8px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:12px;left:12px;padding:11px 14px;background:#07101ddd;border:1px solid #ffffff22;border-radius:9px;pointer-events:none;font-weight:bold;line-height:1.6}
#help{position:absolute;bottom:12px;left:12px;background:#07101ddd;padding:10px;border-radius:8px;color:#d2e0f3;font-size:12px;pointer-events:none}
#touch{position:absolute;bottom:15px;right:14px;display:flex;gap:8px}
#touch button{background:#122b49dd;color:white;border:1px solid #ffffff55;border-radius:12px;padding:17px;font-size:20px;touch-action:none}
footer{text-align:center;padding:30px;color:#7589a5}
@media(max-width:600px){.bar{font-size:12px}.bar button{padding:9px;font-size:11px}#touch button{padding:13px}}
</style>
</head>

{id:"drift2",name:"STREET DRIFT 2",emoji:"🏎️",desc:"Practice smooth turns and drifting.",kind:"drive",sky:0x8ca4bd,ground:0x3c4b50,road:0x252b34,accent:0xff4eae},

{id:"sea",name:"DEEP SEA EXPLORER",emoji:"🌊",desc:"Explore an underwater 3D world.",kind:"fly",sky:0x063d70,ground:0x07517a,road:0x0a6489,accent:0x45e3e9},

{id:"tank",name:"TANK ARENA",emoji:"🛡️",desc:"Drive a tank around an obstacle arena.",kind:"drive",sky:0x8ca9a1,ground:0x5c6749,road:0x6e705b,accent:0x9dbb57},
{id:"robot",name:"ROBOT BATTLE",emoji:"🤖",desc:"Guide a robot through an arena challenge.",kind:"runner",sky:0x879bb4,ground:0x343b4b,road:0x4c5365,accent:0x65d8ff},
{id:"planet",name:"SPACE EXPLORER",emoji:"🪐",desc:"Explore strange planets and space rocks.",kind:"fly",sky:0x11102e,ground:0x4d416c,road:0x66568c,accent:0xc18aff},
{id:"night",name:"F1 NIGHT RACE",emoji:"🌃",desc:"Race through a glowing nighttime circuit.",kind:"drive",sky:0x080e24,ground:0x172a32,road:0x252b38,accent:0x29dfff},
{id:"stunt",name:"STUNT MASTER",emoji:"🤸",desc:"Drive over ramps and stunt jumps.",kind:"drive",sky:0x9bbad3,ground:0x52634c,road:0x535a5e,accent:0xffa53b},
{id:"snowmobile",name:"SNOWMOBILE RUSH",emoji:"🏔️",desc:"Speed across snowy mountain trails.",kind:"drive",sky:0x9bc9e9,ground:0xeaf5ff,road:0xf7fbff,accent:0xff8538}
];

const library=document.getElementById("games");
library.innerHTML=games.map(g=>`
 <article class="card" data-name="${g.name.toLowerCase()}">
  <div class="cover" style="background:linear-gradient(135deg,#244d73,#11182b)">
   ${g.original?'<span class="tag">★ ORIGINAL</span>':''}${g.emoji}
  </div>
  <div class="cardbody">
   <h3>${g.name}</h3>
   <p>${g.desc}</p>
   <button class="play" onclick="startGame('${g.id}')">PLAY NOW</button>
  </div>
 </article>`).join("");

function searchGames(){
 const q=document.getElementById("search").value.toLowerCase();
 document.querySelectorAll(".card").forEach(c=>{
  c.style.display=c.dataset.name.includes(q)?"block":"none";
 });
}
window.searchGames=searchGames;

let game=null,scene,camera,renderer,clock,player;
let active=false,score=0,world=[],obstacles=[],particles=[];
let keys={},playerX=0,playerY=0,playerZ=0,velocityY=0;
let spawnClock=0,elapsed=0,boost=1,frameId=null;
let laneWidth=12;

const stage=document.getElementById("stage");
const hud=document.getElementById("hud");
const playerPanel=document.getElementById("player");

function mat(color,roughness=.75,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
function addBox(parent,x,y,z,sx,sy,sz,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function addSphere(parent,x,y,z,r,color){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat(color));
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}
function addCylinder(parent,x,y,z,r1,r2,h,color){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,16),mat(color));
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}
function addGround(){
  function roadCenter(z){
 return Math.sin(z*.018)*3.2 + Math.sin(z*.043)*1.1;
}

function createCurvyRoad(){
 const vertices=[];
 const indices=[];
 const steps=500;
 const width=6.5;

 for(let i=0;i<=steps;i++){
  const z=40-i*10;
  const center=roadCenter(z);

  vertices.push(center-width,.04,z);
  vertices.push(center+width,.04,z);

  if(i<steps){
   const a=i*2;
   indices.push(a,a+1,a+2,a+1,a+3,a+2);
  }
 }

 const geometry=new THREE.BufferGeometry();
 geometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(vertices,3)
 );
 geometry.setIndex(indices);
 geometry.computeVertexNormals();

 const road=new THREE.Mesh(
  geometry,
  new THREE.MeshStandardMaterial({
   color:game.road,
   roughness:.95,
   side:THREE.DoubleSide
  })
 );

 road.receiveShadow=true;
 scene.add(road);

 // Dashed center markings follow the bends.
 for(let i=0;i<50;i++){
  const z=20-i*10;
  const mark=addBox(
   scene,roadCenter(z),.12,z,.13,.035,3.2,0xe9e9e9
  );
  mark.rotation.y=-Math.atan(
   (roadCenter(z+1)-roadCenter(z-1))/2
  );
 }
}
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(game.ground));
 floor.rotation.x=-Math.PI/2;floor.position.y=-.15;
 floor.receiveShadow=true;scene.add(floor);
}
function addLights(){
 scene.add(new THREE.HemisphereLight(0xdceeff,0x384557,1.8));
 const sun=new THREE.DirectionalLight(0xffffff,2.5);
 sun.position.set(-18,35,18);
 sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 sun.shadow.camera.left=-35;sun.shadow.camera.right=35;
 sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;
 scene.add(sun);
}
function addTree(x,z,s=1,snow=false){
 const g=new THREE.Group();
 addCylinder(g,0,.7,0,.14,.2,1.4,0x62452d);
 for(let i=0;i<3;i++){
  const cone=new THREE.Mesh(new THREE.ConeGeometry(1.05-i*.17,1.8,8),mat(snow?0xf5fbff:0x17623d));
  cone.position.y=1.35+i*.72;cone.castShadow=true;g.add(cone);
 }
 g.position.set(x,0,z);g.scale.setScalar(s);
 scene.add(g);world.push(g);
}
function addBuilding(x,z){
 const h=5+Math.random()*16,w=3+Math.random()*4;
 const g=new THREE.Group();
 const b=addBox(g,0,h/2,0,w,h,w,0x455b70);
 for(let y=1;y<h-1;y+=2){
  for(let x2=-w/2+.7;x2<w/2;x2+=1.3){
   addBox(g,x2,y,w/2+.02,.5,.8,.08,0x8bd5f1);
  }
 }
 g.position.set(x,0,z);scene.add(g);world.push(g);
}
function addMountain(x,z,s,color){
 const m=new THREE.Mesh(new THREE.ConeGeometry(1,2,6),mat(color));
 m.scale.set(s,s*1.8,s);m.position.set(x,s*.8,z);
 m.castShadow=true;scene.add(m);world.push(m);
}
function makeCar(color){
 const g=new THREE.Group();
 addBox(g,0,.62,0,1.85,.55,3.7,color);
 addBox(g,0,1.08,-.25,1.5,.7,1.9,0x182b3e);
 addBox(g,0,1.45,-.25,1.25,.07,1.3,0x8bc9e8);
 addBox(g,-.88,.75,1.35,.12,.18,.35,0xffffff);
 addBox(g,.88,.75,1.35,.12,.18,.35,0xffffff);
 addBox(g,-.88,.65,-1.35,.12,.18,.3,0xff3838);
 addBox(g,.88,.65,-1.35,.12,.18,.3,0xff3838);
 for(const x of [-.98,.98])for(const z of [-1.15,1.15]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.24,20),mat(0x101319));
  wheel.rotation.z=Math.PI/2;wheel.position.set(x,.4,z);wheel.castShadow=true;g.add(wheel);
  addCylinder(g,x*1.02,.4,z,.2,.2,.25,0x8995a5);
 }
 return g;
}
function makeBoard(){
 const g=new THREE.Group();
 addBox(g,0,.1,0,.78,.13,2.15,game.accent);
 addBox(g,0,1.05,0,.55,.8,.35,0xff873c);
 addSphere(g,0,1.7,0,.28,0xe6bd9a);
 addSphere(g,0,1.88,0,.3,0x263b61);
 addBox(g,-.43,1.25,0,.75,.13,.14,0x25364e);
 addBox(g,.43,1.25,0,.75,.13,.14,0x25364e);
 return g;
}
function makeBike(){
 const g=new THREE.Group();
 for(const x of [-.55,.55]){
  const wheel=new THREE.Mesh(new THREE.TorusGeometry(.38,.075,10,24),mat(0x16191d));
  wheel.position.set(x,.45,0);wheel.rotation.y=Math.PI/2;g.add(wheel);
 }
 addBox(g,0,.85,0,.15,.7,.16,0x2d9c69);
 addBox(g,0,1.3,-.1,.32,.42,.3,0xffa044);
 addSphere(g,0,1.75,-.1,.23,0x27384b);
 return g;
}
function makeShip(){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.ConeGeometry(.65,2.4,8),mat(0xcbd8ee,.3,.45));
 body.rotation.x=-Math.PI/2;g.add(body);
 addBox(g,-.8,-.15,0,1.4,.12,.7,0x637ed1);
 addBox(g,.8,-.15,0,1.4,.12,.7,0x637ed1);
 addSphere(g,0,-1.3,0,.3,0xff8a31);
 return g;
}
function makeRobot(){
 const g=new THREE.Group();
 addBox(g,0,1.05,0,.85,.9,.5,0x728da7);
 addBox(g,0,1.8,0,.65,.55,.55,0x263a50);
 addBox(g,-.18,1.85,.29,.12,.12,.08,0x57eaff);
 addBox(g,.18,1.85,.29,.12,.12,.08,0x57eaff);
 addBox(g,-.6,1,0,.25,.85,.25,0x50667d);
 addBox(g,.6,1,0,.25,.85,.25,0x50667d);
 addBox(g,-.25,.35,0,.3,.65,.35,0x34465b);
 addBox(g,.25,.35,0,.3,.65,.35,0x34465b);
 return g;
}
function makePlayer(){
 if(game.kind==="drive")return makeCar(game.accent);
 if(game.id==="robot")return makeRobot();
 if(game.id==="bike")return makeBike();
 if(game.kind==="board")return makeBoard();
 return makeShip();
}
function makeEnvironment(){
 addGround();
 if(game.kind==="drive"||game.kind==="board"||game.kind==="runner"){
  const road=addBox(scene,0,.02,-65,game.id==="city"?15:13,.12,180,game.road);
  world.push(road);
  if(game.id!=="city"&&game.id!=="water"){
   for(let i=0;i<26;i++){
    const snow=game.id==="snow"||game.id==="snowmobile";
    addTree(-12-Math.random()*4,-i*7-5,.8+Math.random()*.6,snow);
    addTree(12+Math.random()*4,-i*7-2,.8+Math.random()*.6,snow);
   }
  }
  if(game.id==="city"){
   for(let i=0;i<30;i++){
    addBuilding(-13-Math.random()*7,-i*9-5);
    addBuilding(13+Math.random()*7,-i*9-5);
   }
  }
  if(game.id==="snow"||game.id==="snowmobile"||game.id==="climb"){
   for(let i=0;i<12;i++){
    addMountain((i%2?1:-1)*(22+Math.random()*10),-i*20-15,8+Math.random()*7,game.id==="climb"?0x777e83:0xd4e7f6);
   }
  }
  if(game.id==="dino"){
   for(let i=0;i<9;i++){
    const d=addBox(scene,(Math.random()-.5)*8,1,-i*18-20,1.5,2,1,0x4d8a43);
    addSphere(scene,d.position.x,2,-i*18-20,.65,0x4d8a43);
   }
  }
  if(game.id==="water"){
   for(let i=0;i<16;i++){
    const rail=addBox(scene,-6,.4,-i*9-10,.35,1,9,0xffdf57);
    const rail2=addBox(scene,6,.4,-i*9-10,.35,1,9,0xffdf57);
    world.push(rail,rail2);
   }
  }
  if(game.id==="skate"||game.id==="stunt"){
   for(let i=0;i<6;i++){
    const ramp=addBox(scene,(Math.random()-.5)*8,.6,-i*25-25,4,1.2,5,game.accent);
    ramp.rotation.x=-.2;world.push(ramp);
   }
  }
 }else{
  for(let i=0;i<180;i++){
   const star=addSphere(scene,(Math.random()-.5)*180,(Math.random()-.5)*100,-Math.random()*220,.06+Math.random()*.09,0xe4efff);
   world.push(star);
  }
  for(let i=0;i<12;i++){
   const rock=addSphere(scene,(Math.random()-.5)*70,(Math.random()-.5)*30,-i*25-20,1+Math.random()*3,0x706c86);
   rock.scale.set(1,1.2,.8);world.push(rock);
  }
  if(game.id==="planet"){
   const planet=addSphere(scene,28,14,-95,12,0x7256bd);
   planet.material.roughness=.95;world.push(planet);
  }
  if(game.id==="sea"){
   for(let i=0;i<35;i++){
    const coral=addCylinder(scene,(Math.random()-.5)*25,1,-i*8-10,.2,.5,2,0x28b8a9);
    world.push(coral);
   }
  }
 }
}
function setupCamera(){
 if(game.id==="drift"||game.id==="drift2"){
  camera.position.set(13,14,17);camera.lookAt(0,0,-8);
 }else if(game.kind==="fly"){
  camera.position.set(0,4,11);camera.lookAt(0,0,-15);
 }else if(game.kind==="board"||game.kind==="runner"){
  camera.position.set(0,5,10);camera.lookAt(0,1,-13);
 }else{
  camera.position.set(0,6,12);camera.lookAt(0,1,-12);
 }
}
function startGame(id){
 game=games.find(g=>g.id===id);
 if(!game)return;
 playerPanel.style.display="flex";
 document.getElementById("title").textContent=game.name;
 document.getElementById("home").style.display="none";
 document.querySelector(".hero").style.display="none";
 document.querySelector("footer").style.display="none";
 if(renderer){renderer.dispose();renderer.domElement.remove();renderer=null}
 if(frameId)cancelAnimationFrame(frameId);
 world=[];obstacles=[];particles=[];
 score=0;elapsed=0;spawnClock=0;playerX=0;playerY=0;playerZ=0;velocityY=0;
 scene=new THREE.Scene();
 scene.background=new THREE.Color(game.sky);
 scene.fog=new THREE.Fog(game.sky,game.kind==="fly"?65:35,game.kind==="fly"?220:150);
 camera=new THREE.PerspectiveCamera(65,stage.clientWidth/stage.clientHeight,.1,500);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
 renderer.setSize(stage.clientWidth,stage.clientHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 stage.insertBefore(renderer.domElement,stage.firstChild);
 clock=new THREE.Clock();
 addLights();makeEnvironment();
 player=makePlayer();scene.add(player);
 setupCamera();
 active=true;
 hud.innerHTML="SCORE: 0<br>SPEED: 0";
 clock.start();
 animate();
}
window.startGame=startGame;

function spawnObstacle(){
 let x=(Math.random()-.5)*9;
 let z=-95;
 let obj;
 if(game.kind==="fly"){
  obj=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2+Math.random()*1.5,1),mat(game.id==="sea"?0x39b9bb:0x85808d));
  obj.position.set(x,(Math.random()-.5)*7,z);
 }else if(game.id==="city"){
  obj=makeCar(0x888888);obj.scale.set(.8,.8,.8);obj.position.set(x,0,z);
 }else if(game.id==="dino"){
  obj=new THREE.Group();
  addBox(obj,0,.8,0,1.5,1.3,2,0x528c3d);
  addSphere(obj,0,1.7,.7,.55,0x69a64c);
  addSphere(obj,.2,1.8,1.18,.12,0xffffff);
  obj.position.set(x,0,z);
 }else if(game.id==="zombie"){
  obj=new THREE.Group();
  addBox(obj,0,1,0,.7,1.5,.5,0x526f4c);
  addSphere(obj,0,2,0,.4,0x9ba47c);
  obj.position.set(x,0,z);
 }else{
  const obstacleColor=game.id==="snow"||game.id==="snowmobile"?0xb9d8eb:game.id==="sea"?0x29b8a9:0x9b7852;
  obj=new THREE.Group();
  addBox(obj,0,.7,0,1.5,1.4,1.4,obstacleColor);
  if(game.id==="tank")addBox(obj,0,1.5,0,.6,.6,1,0x53684a);
  obj.position.set(x,0,z);
 }
 obj.userData={passed:false};
 scene.add(obj);obstacles.push(obj);
}
function burst(x,y,z,color){
 for(let i=0;i<13;i++){
  const p=new THREE.Mesh(new THREE.SphereGeometry(.09+Math.random()*.09,8,8),new THREE.MeshBasicMaterial({color,transparent:true}));
  p.position.set(x,y,z);
  p.userData={vx:(Math.random()-.5)*5,vy:Math.random()*5,vz:(Math.random()-.5)*5,life:.65};
  scene.add(p);particles.push(p);
 }
}
function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i],u=p.userData;
  u.life-=dt;p.position.x+=u.vx*dt;p.position.y+=u.vy*dt;p.position.z+=u.vz*dt;
  u.vy-=8*dt;p.scale.multiplyScalar(.97);
  if(u.life<=0){scene.remove(p);p.geometry.dispose();p.material.dispose();particles.splice(i,1)}
 }
}
function animate(){
 if(!active)return;
 frameId=requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 elapsed+=dt;
 const fast=keys.Shift?1.7:1;
 const speed=(game.kind==="fly"?22:game.id==="snow"||game.id==="snowmobile"?24:19)*fast;
 score+=dt*speed*.4;
 const left=keys.ArrowLeft||keys.a||keys.A;
 const right=keys.ArrowRight||keys.d||keys.D;
 const up=keys.ArrowUp||keys.w||keys.W;
 const down=keys.ArrowDown||keys.s||keys.S;
 playerX+=(right?1:0)-(left?1:0);
 playerX=Math.max(-5.2,Math.min(5.2,playerX));
 if(game.kind==="fly"){
  playerY+=(up?1:0)-(down?1:0);
  playerY=Math.max(-4,Math.min(5,playerY));
 }else{
  if(keys[" "]&&playerY<=0.02)velocityY=10;
  velocityY-=24*dt;
  playerY=Math.max(0,playerY+velocityY*dt);
  if(playerY===0)velocityY=0;
 }
 player.position.set(playerX,playerY,0);
 if(game.kind==="drive"){
  player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-(right?1:0)+(left?1:0)*.18,.08);
  player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,(right?-.15:0)+(left?.15:0),.08);
 }else{
  player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,(right?-.15:0)+(left?.15:0),.1);
 }
 const moveSpeed=speed*dt;
 for(const obj of world){
  obj.position.z+=moveSpeed;
  if(obj.position.z>18)obj.position.z-=200;
 }
 spawnClock+=dt;
 if(spawnClock>(game.kind==="fly"?.85:1.05)){
  spawnObstacle();spawnClock=0;
 }
 for(let i=obstacles.length-1;i>=0;i--){
  const o=obstacles[i];o.position.z+=moveSpeed;
  if(game.kind==="fly"&&o.position.y!==undefined){
   o.rotation.x+=dt*.5;o.rotation.y+=dt*.7;
  }
  if(o.position.z>2&&!o.userData.passed){
   o.userData.passed=true;
   score+=10;
   if(Math.abs(o.position.x-playerX)<1.45&&Math.abs(o.position.y-playerY)<2.2){
    score=Math.max(0,score-25);
    burst(playerX,playerY+1,0,0xff923c);
   }
  }
  if(o.position.z>18){
   scene.remove(o);obstacles.splice(i,1);
  }
 }
 updateParticles(dt);
 const targetX=playerX*.3;
 camera.position.x+=(targetX-camera.position.x)*.04;
 if(game.kind==="fly"){
  camera.position.y+=(playerY*.3+3-camera.position.y)*.04;
  camera.lookAt(playerX*.4,playerY*.5,-15);
 }else if(game.id==="drift"||game.id==="drift2"){
  camera.lookAt(playerX*.3,0,-8);
 }else{
  camera.lookAt(playerX*.25,1+playerY*.15,-13);
 }
 hud.innerHTML="SCORE: "+Math.floor(score)+"<br>SPEED: "+Math.floor(speed*fast)+" km/h";
 renderer.render(scene,camera);
}
function home(){
 active=false;
 if(frameId)cancelAnimationFrame(frameId);
 if(renderer){renderer.dispose();renderer.domElement.remove();renderer=null}
 playerPanel.style.display="none";
 document.getElementById("home").style.display="block";
 document.querySelector(".hero").style.display="block";
 document.querySelector("footer").style.display="block";
}
window.home=home;
function fullscreen(){
 const el=playerPanel;
 if(!document.fullscreenElement){el.requestFullscreen?.()}
 else{document.exitFullscreen?.()}
}
window.fullscreen=fullscreen;

window.addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
});
window.addEventListener("keyup",e=>keys[e.key]=false);
window.addEventListener("blur",()=>keys={});

function bindTouch(id,key){
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault();keys[key]=true};
 const up=e=>{e.preventDefault();keys[key]=false};
 el.addEventListener("pointerdown",down);
 el.addEventListener("pointerup",up);
 el.addEventListener("pointerleave",up);
 el.addEventListener("pointercancel",up);
}
bindTouch("left","ArrowLeft");
bindTouch("right","ArrowRight");
bindTouch("jump"," ");

window.addEventListener("resize",()=>{
 if(!renderer||!camera)return;
 camera.aspect=stage.clientWidth/stage.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(stage.clientWidth,stage.clientHeight);
});
</script>
</body>
</html>
